<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Dividend Scenario Comparison</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
        --success: #34d399;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a 45%, #111827);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 24px;
      }

      h1 {
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 24px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.2);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }

      .inputs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #0b1220;
        color: var(--text);
      }

      button {
        background: var(--accent-strong);
        color: #082f49;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 700;
      }

      .results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .result-card {
        background: var(--card);
        border: 1px solid rgba(125, 211, 252, 0.15);
        border-radius: 10px;
        padding: 16px;
      }

      .result-card h3 {
        margin-top: 0;
        color: var(--accent);
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AI Dividend Scenario Comparison</h1>
      <p class="subtitle">Compare different public-claim assumptions across AI surplus scenarios.</p>

      <div class="panel">
        <div class="inputs">
          <div>
            <label for="profit">AI Profit</label>
            <input id="profit" type="number" value="1000000000" />
          </div>
          <div>
            <label for="compute">Compute Surplus</label>
            <input id="compute" type="number" value="500000000" />
          </div>
          <div>
            <label for="data">Data Licensing</label>
            <input id="data" type="number" value="250000000" />
          </div>
          <div>
            <label for="population">Population</label>
            <input id="population" type="number" value="10000000" />
          </div>
          <div>
            <label for="tauLow">Low τ</label>
            <input id="tauLow" type="number" step="0.01" value="0.15" />
          </div>
          <div>
            <label for="tauBase">Base τ</label>
            <input id="tauBase" type="number" step="0.01" value="0.30" />
          </div>
          <div>
            <label for="tauHigh">High τ</label>
            <input id="tauHigh" type="number" step="0.01" value="0.60" />
          </div>
        </div>

        <button id="compareBtn">Compare Scenarios</button>
      </div>

      <div id="results" class="results" style="margin-top: 24px;"></div>
    </div>

    <script>
      function calculateScenario(name, tau) {
        const profit = parseFloat(document.getElementById('profit').value) || 0;
        const compute = parseFloat(document.getElementById('compute').value) || 0;
        const data = parseFloat(document.getElementById('data').value) || 0;
        const population = parseFloat(document.getElementById('population').value) || 1;

        const totalRevenue = profit + compute + data;
        const publicFund = tau * totalRevenue;
        const annualDividend = publicFund / population;
        const monthlyDividend = annualDividend / 12;

        return {
          name,
          tau,
          annualDividend,
          monthlyDividend,
          publicFund,
          totalRevenue,
        };
      }

      document.getElementById('compareBtn').addEventListener('click', () => {
        const scenarios = [
          calculateScenario('Low public claim', parseFloat(document.getElementById('tauLow').value) || 0),
          calculateScenario('Base public claim', parseFloat(document.getElementById('tauBase').value) || 0),
          calculateScenario('High public claim', parseFloat(document.getElementById('tauHigh').value) || 0),
        ];

        const resultsContainer = document.getElementById('results');
        resultsContainer.innerHTML = '';

        scenarios.forEach((scenario) => {
          const card = document.createElement('div');
          card.className = 'result-card';
          card.innerHTML = `
            <h3>${scenario.name}</h3>
            <p><strong>τ:</strong> ${scenario.tau}</p>
            <p><strong>Annual dividend/person:</strong> $${scenario.annualDividend.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
            <p><strong>Monthly dividend/person:</strong> $${scenario.monthlyDividend.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
            <p><strong>Public fund:</strong> $${scenario.publicFund.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
            <p class="muted"><strong>Total revenue:</strong> $${scenario.totalRevenue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
          `;
          resultsContainer.appendChild(card);
        });
      });

      document.getElementById('compareBtn').click();
    </script>
  </body>
</html>

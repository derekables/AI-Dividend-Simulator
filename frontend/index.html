<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Dividend Simulator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>AI Dividend Simulator</h1>
        <p class="subtitle">Model how AI-generated surplus becomes universal dividends.</p>

        <div class="input-section">
            <label>Total AI Profits (per year):</label>
            <input id="profit" type="number" value="1000000000" />

            <label>Compute Surplus (per year):</label>
            <input id="compute" type="number" value="500000000" />

            <label>Data Licensing Revenue (per year):</label>
            <input id="data" type="number" value="250000000" />

            <label>Population:</label>
            <input id="population" type="number" value="10000000" />

            <label>Public Share (τ):</label>
            <input id="tau" type="number" step="0.01" value="0.3" />

            <button id="simulateBtn">Run Simulation</button>
        </div>

        <div class="output-section">
            <h2>Results</h2>
            <p id="annual"></p>
            <p id="monthly"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
